# CORS proxy for RustFS S3-compatible storage.
# Sits in front of RustFS and adds CORS headers that RustFS itself doesn't provide.
# Handles both preflight (OPTIONS) and actual S3 API requests (PUT/GET/POST/DELETE).

server {
    listen 9000;
    server_name _;

    client_max_body_size 100M;

    # CORS headers on every response (server-level, inherited by all locations).
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, PUT, POST, DELETE, HEAD, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers'
        'Content-Type, Content-MD5, x-amz-acl, x-amz-date, x-amz-content-sha256, Authorization, x-amz-user-agent, x-amz-security-token'
        always;
    add_header 'Access-Control-Expose-Headers'
        'ETag, x-amz-request-id, x-amz-version-id'
        always;

    location / {
        # Preflight: respond immediately, don't forward to RustFS.
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        proxy_pass http://rustfs:9000;

        # Force Host to match the S3_ENDPOINT used for pre-signed URL signatures.
        # Rathole may rewrite the Host header, which breaks signature validation.
        proxy_set_header Host 82.157.33.107:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass original request headers through to RustFS.
        proxy_pass_request_headers on;
    }
}
